services:
  - type: web
    name: specloop-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_INPUT_USD_PER_1M
        sync: false
      - key: OPENAI_CACHED_INPUT_USD_PER_1M
        sync: false
      - key: OPENAI_OUTPUT_USD_PER_1M
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://0101xiayingluo.github.io
      - key: MAX_REQUESTS_PER_MINUTE
        value: 12
      - key: MAX_CONCURRENT_MODEL_REQUESTS
        value: 2
      - key: MODEL_TIMEOUT_MS
        value: 30000
